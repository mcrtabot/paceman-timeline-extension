<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>MCSR Timeline for PaceMan — Settings</title>
    <style>
      /* オプションのタブとしても、拡張ボタンのポップアップとしても開かれる。
         ポップアップは中身に合わせて伸びるので、幅を決めておく。 */
      body { margin: 0; padding: 18px 20px; background: #14171c; color: #e6e8eb; font: 14px system-ui, sans-serif; min-width: 440px; max-width: 560px; }
      h1 { font-size: 16px; margin: 0 0 20px; }
      h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: #8b95a3; margin: 24px 0 8px; }
      label { display: flex; align-items: center; gap: 8px; margin: 8px 0; }
      input[type="number"] { width: 80px; background: #1c2029; color: inherit; border: 1px solid #3d4553; border-radius: 4px; padding: 4px 6px; font: inherit; }
      .hint { color: #8b95a3; font-size: 12px; margin: 2px 0 8px 26px; }
      /* 項目と「?」を同じ行に並べる。label 自身の余白は row に移す */
      .row { display: flex; align-items: center; gap: 6px; margin: 8px 0; }
      .row > label, .row > .iconset__name { margin: 0; }
      /* お気に入り一覧。名前の長さがまちまちなので折り返しで並べる */
      .favs { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 0; }
      .fav { display: inline-flex; align-items: center; gap: 6px; padding: 3px 4px 3px 6px;
        border: 1px solid #3d4553; border-radius: 999px; background: #1c2029; }
      .fav__face { width: 18px; height: 18px; border-radius: 2px; image-rendering: pixelated; }
      .fav__x { width: 18px; height: 18px; padding: 0; border: 0; border-radius: 50%;
        background: none; color: #8b95a3; font: 15px/1 system-ui, sans-serif; cursor: pointer; }
      .fav__x:hover { background: #3d4553; color: #e6e8eb; }
      .help { flex: none; width: 16px; height: 16px; padding: 0; border: 1px solid #3d4553;
        border-radius: 50%; background: none; color: #8b95a3; font: 11px/1 system-ui, sans-serif;
        cursor: pointer; }
      .help:hover, .help[aria-expanded="true"] { color: #e6e8eb; border-color: #5a6473; }
      .iconset { display: flex; align-items: center; gap: 10px; margin: 6px 0; cursor: pointer; }
      .preview { display: inline-flex; align-items: center; gap: 4px; }
      .preview__icon { width: 22px; height: 22px; object-fit: contain; image-rendering: pixelated; flex: none; }
      /* timeline.css はこの画面では読まないので、スプライトの指定はここにも要る */
      .preview__icon.ptc-sprite { background-image: var(--ptc-sprite-url); background-repeat: no-repeat;
        background-size: calc(22px * var(--ptc-sprite-cols)) calc(22px * var(--ptc-sprite-rows));
        background-position: calc(22px * var(--ptc-sprite-col) * -1) calc(22px * var(--ptc-sprite-row) * -1); }
      .iconset__name { color: #b9c3cf; }
      .choice { display: inline-flex; align-items: center; gap: 5px; margin: 0; }
      /* 見本用。実際の描画では content/font.ts が同じ family を登録する */
      @font-face { font-family: 'ptc-mc'; src: url('https://paceman.gg/stats/mc.ttf') format('truetype'); }
      /* timeline.css はこの画面では読まないので、輪郭の指定はここにも要る */
      .ptc-outlined { filter:
        drop-shadow(1px 0 0 rgba(255,255,255,.45))
        drop-shadow(-1px 0 0 rgba(255,255,255,.45))
        drop-shadow(0 1px 0 rgba(255,255,255,.45))
        drop-shadow(0 -1px 0 rgba(255,255,255,.45)); }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./options.tsx"></script>
  </body>
</html>
