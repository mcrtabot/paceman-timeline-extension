<!--
  トップページ（/）の DOM 骨格。2026-09-05 に実ページから採取したタグ + クラスのツリーを再構成したもの。
  テキストはダミーだが、**入れ子とクラス名は実物と一致している**。

  重要なのは main 直下の縦並び:
      main > div.flex.flex-col.h-full.fade-in
        ├─ div.w-full.text-center.mb-8        … タイトル
        └─ div.bg-gray-800/30...              … Active Pace カード
             ├─ div.p-3.bg-gray-800/50...     … カードのヘッダ
             └─ div.overflow-auto.h-full
                  └─ div.w-full
                       └─ div.overflow-y-auto.max-h-[50vh].pb-4   … 行のスクローラ
-->
<main class="flex-1 container mx-auto px-4 py-6 flex flex-col">
  <div class="flex flex-col h-full fade-in">
    <div class="w-full text-center mb-8">
      <h1 class="relative inline-block text-5xl lg:text-7xl">PaceMan</h1>
      <p class="text-lg text-gray-300 mt-2 fade-in">Minecraft speedrun pace tracking</p>
    </div>
    <div class="bg-gray-800/30 backdrop-blur-sm border border-gray-700 rounded-xl shadow-xl overflow-hidden flex-1 max-w-5xl mx-auto w-full">
      <div class="p-3 bg-gray-800/50 border-b border-gray-700">
        <div class="flex items-center">
          <h2 class="text-xl font-medium">Active Pace</h2>
        </div>
        <div class="flex items-center gap-4">
          <button class="text-gray-300 hover:text-white transition-all p-2">filter</button>
        </div>
      </div>
      <div class="overflow-auto h-full"><div class="flex flex-col items-center justify-center py-16 text-center"><p class="text-gray-300 text-lg mb-2">No one is currently on pace...</p><p class="text-gray-500 text-sm">Check back soon or adjust your filter settings</p></div></div>
    </div>
  </div>
</main>
